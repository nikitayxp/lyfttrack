# Dependabot — version updates + security PRs for LyftTrack
# https://docs.github.com/code-security/dependabot

version: 2
updates:
  # Monorepo npm workspaces (root lockfile covers app + site)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 8
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Expo-managed packages must track the installed SDK — the SDK pins their
      # versions, so bump them with `npx expo install --fix` on an SDK upgrade,
      # never via Dependabot. (The #116-#123 wave tried to jump these to SDK 57
      # / RN 0.86 on an SDK 54 project, which breaks the build.)
      #
      # expo itself: allow patch within the SDK, block minor/major.
      - dependency-name: "expo"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "expo-*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "eslint-config-expo"
        update-types:
          - version-update:semver-major
      # React / React Native and the SDK-pinned native modules: Dependabot must
      # not touch these at all — the Expo SDK owns their exact versions.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/async-storage"
    groups:
      # Fewer PRs: patch/minor together; majors stay separate for review
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions workflows (when present under .github/workflows)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 4
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
